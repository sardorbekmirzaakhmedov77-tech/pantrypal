{% macro card(r) %}<a class="recipe-card" href="{{ url_for('recipe',rid=r.id) }}"><div class="card-photo">{% if r.image %}<img src="{{ r.image }}" alt="{{ r.title }}" loading="lazy">{% else %}<span class="food-fallback">◒</span>{% endif %}<span class="photo-tag">{{ r.category }}</span><span class="circle-arrow">↗</span></div><div class="card-body"><span class="eyebrow">{{ r.cuisine }} · THEMEALDB</span><h3>{{ r.title }}</h3><span class="card-link">Let’s make this →</span></div></a>{% endmacro %}
